[project]
name = "book-review-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "redis>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "moto[dynamodb,sqs]>=5,<6", "httpx>=0.28,<1", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
